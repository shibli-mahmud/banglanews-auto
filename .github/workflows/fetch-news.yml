name: Fetch and Generate News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - run: npm install
      - run: npm run fetch:news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAX_ARTICLES_PER_RUN: "25"
          REQUEST_DELAY_MS: "4000"
          RETRY_LIMIT: "3"

      - run: npm run generate:sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Distribute to social channels
        if: ${{ vars.SOCIAL_AUTO_POST_ENABLED == 'true' }}
        run: npm run social:distribute
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          SOCIAL_POST_LIMIT: "6"
          SOCIAL_POST_WINDOW_HOURS: "2"

      - name: Commit new articles
        run: |
          git config user.name "NewsBot"
          git config user.email "bot@banglabriefing.com"
          git add content/ public/sitemap.xml
          git diff --staged --quiet || git commit -m "Auto: Add new articles $(date)"
          git push
