name: Fetch and Generate News

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: version1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - run: npm install
      - run: npm run fetch:news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          MAX_ARTICLES_PER_RUN: "5"
          MAX_ITEMS_PER_FEED: "2"
          REQUEST_DELAY_MS: "20000"
          RETRY_DELAY_MS: "30000"
          RETRY_LIMIT: "3"
          RETENTION_DAYS: "21"

      - run: npm run prune:news
        env:
          RETENTION_DAYS: "21"

      - run: npm run generate:sitemap
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Distribute to social channels
        if: ${{ vars.SOCIAL_AUTO_POST_ENABLED == 'true' }}
        run: npm run social:distribute
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOCIAL_WEBHOOK_URL: ${{ secrets.SOCIAL_WEBHOOK_URL }}
          SOCIAL_POST_LIMIT: "6"
          SOCIAL_POST_WINDOW_HOURS: "2"

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ public/sitemap.xml data/
          git diff --staged --quiet || git commit -m "Auto: Add new articles $(date)"
          git push
