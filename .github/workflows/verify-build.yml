name: Verify Build

on:
  push:
    branches:
      - version1
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - run: npm ci
      - run: npm run preflight
        env:
          SITE_URL: https://banglanews-auto.vercel.app
      - run: npm run build
